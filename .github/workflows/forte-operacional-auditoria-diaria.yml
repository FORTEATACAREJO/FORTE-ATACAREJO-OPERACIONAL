name: Auditoria diaria - FORTE ATACAREJO OPERACIONAL
on:
  workflow_dispatch:
  schedule:
    # 09:10 horario de Brasilia (UTC-3); apenas em dias uteis.
    - cron: '10 12 * * 1-5'
permissions:
  contents: read
concurrency:
  group: auditoria-integracao-forte
  cancel-in-progress: true
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identidade, isolamento fiscal e regras da migracao
        run: node --test checks/unificacao-identidade.test.mjs checks/migracao-frete.test.mjs checks/plano-importacao-frete.test.mjs checks/matriz-consolidacao.test.mjs
      - name: Publicar resumo automatico
        if: always()
        run: |
          echo "### FORTE ATACAREJO OPERACIONAL" >> "$GITHUB_STEP_SUMMARY"
          echo "Auditoria automatica dos contratos de unificacao, sem acesso a dados de producao." >> "$GITHUB_STEP_SUMMARY"
          echo "A rotina nao publica alteracoes nem altera o FORTE FISCAL." >> "$GITHUB_STEP_SUMMARY"
