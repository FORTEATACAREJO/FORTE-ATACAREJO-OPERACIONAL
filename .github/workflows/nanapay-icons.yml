name: Nanapay - atualizar icone aprovado
on:
  push:
    branches:
      - homolog/nanapay
    paths:
      - "nanapay/assets/nanapay-selected.webp.base64"
      - "nanapay/icon.svg"
      - ".github/workflows/nanapay-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-png-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar conversor da arte aprovada
        run: |
          python3 -m pip install --user --disable-pip-version-check "Pillow==11.3.0"
      - name: Gerar icones da terceira imagem aprovada sem redesenhar
        run: |
          python3 - <<'PY'
          import base64, hashlib, io
          from pathlib import Path
          from PIL import Image
          root=Path("nanapay")
          encoded=(root/"assets"/"nanapay-selected.webp.base64").read_text(encoding="ascii").strip()
          raw=base64.b64decode(encoded,validate=True)
          expected="d729dfcedd201b543292ce18fa087b82ccbe10cf7a96dba31be8471dddac376f"
          actual=hashlib.sha256(raw).hexdigest()
          if actual!=expected: raise RuntimeError(f"Imagem nao corresponde a arte aprovada: {actual}")
          image=Image.open(io.BytesIO(raw)).convert("RGBA")
          if image.size!=(512,512):raise RuntimeError(f"Formato inesperado {image.size}")
          for size in (192,512):
              output=io.BytesIO()
              image.resize((size,size),Image.Resampling.LANCZOS).save(output,format="PNG",optimize=True)
              b=output.getvalue()
              target=root/"assets"/f"icon-{size}.png.base64"
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(base64.b64encode(b).decode("ascii")+"\n",encoding="ascii")
              print("Nanapay aprovado",size,len(b))
          svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nanapay — N esmeralda em orbita"><image width="512" height="512" href="data:image/webp;base64,'+encoded+'"/></svg>\n'
          (root/"icon.svg").write_text(svg,encoding="utf-8")
          PY
      - name: Versionar icone aprovado Android iPhone e web
        run: |
          git config user.name "Nanapay GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nanapay/icon.svg nanapay/assets/icon-192.png.base64 nanapay/assets/icon-512.png.base64
          if git diff --cached --quiet; then
            echo "Icones ja correspondem a arte aprovada."
          else
            git commit -m "brand(nanapay): aplica iconografia opcao 3 orbital em todas as plataformas"
            git push
          fi
