name: FORTE-OP - icones PWA Chrome e Safari
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/forte-op-icon.svg'
      - '.github/workflows/forte-op-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar PNGs do icone FORTE-OP
        run: |
          python -m pip install --quiet CairoSVG==2.8.2
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source='apps/web/public/forte-op-icon.svg'
          out=Path('apps/web/public/icons')
          out.mkdir(parents=True, exist_ok=True)
          for size in (180,192,512):
              cairosvg.svg2png(url=source,write_to=str(out/f'forte-op-{size}.png'),output_width=size,output_height=size)
          PY
      - name: Gravar PNGs de instalacao no proprio repositorio
        run: |
          git config user.name 'forte-op-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add apps/web/public/icons/forte-op-180.png apps/web/public/icons/forte-op-192.png apps/web/public/icons/forte-op-512.png
          if ! git diff --cached --quiet; then
            git commit -m "build(forte-op): instaladores PNG Chrome Safari [skip ci]"
            git push
          fi
