name: Nanapay homologacao - smoke test
on:
  push:
    branches:
      - homolog/nanapay
    paths:
      - "nanapay/**"
      - ".github/workflows/nanapay-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test server flows
        run: node nanapay/tests/smoke.mjs
      - name: Test tenant role authorization without real Supabase keys
        run: node nanapay/tests/identity.mjs
