name: FORTE-OP Android APK
on:
  push:
    branches: [main]
    paths: ['android-apk/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare FORTE-OP launcher icon
        run: |
          python3 -m pip install --quiet 'CairoSVG==2.8.2'
          mkdir -p android-apk/app/src/main/res/drawable
          python3 -c "import cairosvg; cairosvg.svg2png(url='apps/web/public/forte-op-icon.svg',write_to='android-apk/app/src/main/res/drawable/app_icon.png',output_width=512,output_height=512)"

      - name: Build installable APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Forte-OP.apk
      - name: Publish stable Android download
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: 'FORTE-OP Android'
          artifacts: 'Forte-OP.apk'
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
